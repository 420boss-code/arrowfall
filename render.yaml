# Render Blueprint: one free web service runs the game server, which also serves the site.
# In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: arrowfall
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY        # Render sits behind a proxy: use the real client IP for rate limits
        value: "1"
      - key: ADMIN_PASSWORD     # 5-letter word + 2 digits, e.g. otter58 – entered in Render's dashboard, never in git
        sync: false
      - key: CODE_SECRET        # long random secret that every player code is calculated from – never in git
        sync: false
      - key: REVOKED_PLAYERS    # optional: player numbers blocked for good, e.g. "7,12"
        sync: false
      - key: ALLOW_SIGNUP       # "0" closes self sign-up at every start; anything else leaves it open
        value: "1"
